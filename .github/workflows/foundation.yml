name: Foundation checks

on:
  # Pull requests run once through pull_request; pushes run only on main.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    # Durable archive failure tests verify captured executables repeatedly.
    # The combined driver/API suite takes over eight minutes on this runner.
    timeout-minutes: 20
    env:
      PLAYTIME_DOCKER_TESTS: "0"
      # Keep the GUI dependency graph and repeated fixture links within hosted
      # runner disk/memory limits. Local development retains its debug profiles.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain
        run: |
          playtime_toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$playtime_toolchain" --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy -p playtime-engine -p playtime-runner --all-targets --features test-harness --locked -- -D warnings
      - run: cargo test -p playtime-engine --features test-harness --locked
      - run: cargo test -p playtime-runner --features test-harness --test workspace_probe --locked
      - run: ./scripts/test-rust-cli-e2e.sh --backend fixture
      - run: ./scripts/test-rust-ui-e2e.sh --backend fixture
      - run: python3 -m unittest discover -s tests -v
      - name: Report runner resources
        if: always()
        run: |
          df -h .
          du -sh target
          free -h

  worker-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install static worker build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          rustup toolchain install 1.94.1 --profile minimal --target x86_64-unknown-linux-musl
      - name: Build frozen worker and run controller package gate
        run: ./scripts/test-rust-worker-package.sh

  service-normal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install frozen worker build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          rustup toolchain install 1.94.1 --profile minimal --target x86_64-unknown-linux-musl
      - name: Exercise normal daemon, detached controller, client and workbench
        run: ./scripts/test-rust-service-e2e.sh --case normal

  ui-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Ubuntu 26.04 multiarch index, verified 2026-10-17; amd64 runner.
      image: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    env:
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
      XDG_RUNTIME_DIR: /tmp/playtime-ui-runtime
    steps:
      - name: Install the exact reviewed software Vulkan renderer
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential pkg-config libxkbcommon-dev libwayland-dev libudev-dev mesa-vulkan-drivers=26.0.8-1ubuntu0.3 libllvm21=1:21.1.8-6ubuntu1 libvulkan1=1.4.341.0-1
          install -d -m 700 "$XDG_RUNTIME_DIR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/playtime-rustup.sh
          sh /tmp/playtime-rustup.sh -y --profile minimal --default-toolchain 1.94.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Compare reviewed workbench screenshots (no renderer fallback)
        run: cargo test --locked -p playtime-ui --features ui-snapshots --test snapshots
