[workspace]
members = ["crates/playtime-core", "crates/playtime-protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
playtime-core = { path = "crates/playtime-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
utoipa = "=6.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
