[workspace]
members = [
    "crates/playtime-core",
    "crates/playtime-protocol",
    "crates/playtime-engine",
    "crates/playtime-storage",
    "crates/playtime-runner",
    "crates/playtime-server",
    "crates/playtime-worker-control",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
playtime-core = { path = "crates/playtime-core" }
playtime-protocol = { path = "crates/playtime-protocol" }
playtime-engine = { path = "crates/playtime-engine" }
playtime-storage = { path = "crates/playtime-storage" }
playtime-worker-control = { path = "crates/playtime-worker-control" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
utoipa = "=6.0.0"
sha2 = "=0.11.1"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
rustix = { version = "=1.1.4", features = ["fs"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
async-trait = "=0.1.92"
getrandom = "=0.4.3"
subtle = "=2.6.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
time = { version = "=0.3.47", features = ["formatting"] }

[workspace.lints.rust]
unsafe_code = "forbid"
