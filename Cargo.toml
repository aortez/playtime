[workspace]
members = [
    "crates/playtime-core",
    "crates/playtime-protocol",
    "crates/playtime-engine",
    "crates/playtime-storage",
    "crates/playtime-server",
    "crates/playtime-client",
    "crates/playtime-local",
    "crates/playtime-cli",
    "crates/playtime-test-support",
    "crates/playtime-runner",
    "crates/playtime-ui",
    "crates/playtime-worker-control",
    "crates/playtime-worker",
    "crates/playtime-docker",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
playtime-core = { path = "crates/playtime-core" }
playtime-protocol = { path = "crates/playtime-protocol" }
playtime-engine = { path = "crates/playtime-engine" }
playtime-storage = { path = "crates/playtime-storage" }
playtime-local = { path = "crates/playtime-local" }
playtime-client = { path = "crates/playtime-client" }
playtime-test-support = { path = "crates/playtime-test-support" }
playtime-worker-control = { path = "crates/playtime-worker-control" }
playtime-runner = { path = "crates/playtime-runner" }
playtime-worker = { path = "crates/playtime-worker" }
playtime-docker = { path = "crates/playtime-docker" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
utoipa = "=6.0.0"
sha2 = "=0.11.1"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
rustix = { version = "=1.1.4", features = ["fs"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-util = { version = "=0.7.20", features = ["io", "rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "query"] }
async-trait = "=0.1.92"
async-stream = "=0.3.6"
futures-util = "=0.3.34"
base64 = "=0.23.1"
getrandom = "=0.4.3"
subtle = "=2.6.1"
serde_urlencoded = "=0.7.1"
http-body-util = "=0.1.5"
clap = { version = "=4.6.7", features = ["derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
time = { version = "=0.3.47", features = ["formatting"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Fixture control verifies large captured executables inside a five-second
# request deadline. Keep hashing fast in debug/test builds under CI contention.
[profile.dev.package.sha2]
opt-level = 3
