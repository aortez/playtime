[package]
name = "playtime-chat"
default-run = "playtime-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
playtime-core.workspace = true
playtime-protocol.workspace = true
playtime-engine = { path = "../playtime-engine" }
playtime-harness.workspace = true
playtime-local.workspace = true
playtime-docker.workspace = true
playtime-strata.workspace = true
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustix.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
shlex = "=2.0.1"
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true

ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
# Enable only the Crossterm scrolling backend, keeping other terminal backends out.
ratatui-crossterm = { version = "=0.1.2", features = ["scrolling-regions"] }
ratatui-textarea = "=0.9.4"
# The polling backend returns on PTY hangup; the Mio backend can spin on EOF.
crossterm = { version = "=0.29.0", features = ["use-dev-tty"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
unicode-segmentation = "=1.13.3"

[lints]
workspace = true
