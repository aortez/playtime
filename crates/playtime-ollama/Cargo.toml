[package]
name = "playtime-ollama"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["tls"]
# HTTPS endpoints. The static packaged worker reaches its LAN backend over plain
# HTTP and builds without this, so it needs no C crypto toolchain.
tls = ["reqwest/rustls", "dep:rustls", "dep:webpki-roots"]

[dependencies]
playtime-core.workspace = true
playtime-engine.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
ryu = "=1.0.23"
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"], optional = true }
webpki-roots = { version = "=1.0.9", optional = true }
async-trait.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }

[lints]
workspace = true
