[package]
name = "playtime-ollama"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
playtime-core.workspace = true
playtime-engine.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
ryu = "=1.0.23"
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
webpki-roots = "=1.0.9"
async-trait.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }

[lints]
workspace = true
