[package]
name = "playtime-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
playtime-docker.workspace = true
playtime-core.workspace = true
playtime-protocol.workspace = true
playtime-local.workspace = true
playtime-worker-control.workspace = true
playtime-worker.workspace = true
playtime-runner.workspace = true
playtime-storage.workspace = true
playtime-engine.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures-util.workspace = true
sha2.workspace = true
base64.workspace = true
serde_urlencoded.workspace = true
http-body-util.workspace = true
rusqlite.workspace = true
time.workspace = true
# Match the workbench's AccessKit D-Bus backend. Enabling zbus/tokio here
# would also switch its runtime through workspace feature unification.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rustix = { workspace = true, features = ["process"] }
playtime-client = { path = "../playtime-client" }
reqwest.workspace = true
jsonschema = { version = "=0.59.0", default-features = false }

[lints]
workspace = true
