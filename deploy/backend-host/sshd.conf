Match User playtime-bridge
    AuthenticationMethods publickey
    AuthorizedKeysFile /etc/playtime-backend/authorized_keys
    ForceCommand /usr/libexec/playtime-backend-bridge
    DisableForwarding yes
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    MaxAuthTries 2
Match all
